<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player Dashboard</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        background: #fff;
        color: #000;
        font-family:
          franklin-gothic-urw, "Franklin Gothic Medium", Arial, sans-serif;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 16px;
      }
      a.back {
        color: #000;
        text-decoration: underline;
        font-size: 0.85rem;
      }
      a.back:hover {
        color: #0000ff;
      }
      h1 {
        font-size: 1.4rem;
        text-align: center;
      }
      .panel {
        border: 1px solid #000;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 560px;
        width: 100%;
        margin: 0 auto;
      }
      .status-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .status-pill {
        border: 1px solid #000;
        padding: 4px 10px;
        min-width: 80px;
        text-align: center;
        font-size: 0.9rem;
      }
      .state-running {
        background: #dff8df;
      }
      .state-paused {
        background: #fff5cc;
      }
      .state-stopped {
        background: #f2f2f2;
      }
      .button-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(120px, 1fr));
        gap: 10px;
      }
      button {
        border: 1px solid #000;
        background: #0000ff;
        color: #fff;
        padding: 10px;
        font-family: inherit;
        font-size: 0.95rem;
        cursor: pointer;
      }
      button:hover {
        background: #000;
      }
      button:disabled {
        background: #ccc;
        color: #666;
        cursor: not-allowed;
      }
      .brightness-row {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 180px;
      }
      .brightness-row input {
        flex: 1;
        accent-color: #0000ff;
      }
      #brightness-val {
        min-width: 2ch;
        text-align: right;
      }
      .warning {
        display: none;
        color: #cc6600;
        font-size: 0.85rem;
      }
      #message {
        min-height: 1.2em;
        font-size: 0.9rem;
      }
      #message.ok {
        color: #007700;
      }
      #message.err {
        color: #cc0000;
      }
      ::selection {
        color: #fff;
        background: #000;
      }
      .library-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .library-head strong {
        font-size: 1rem;
      }
      .import-label {
        font-size: 0.8rem;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }
      .import-label input {
        font-size: 0.75rem;
      }
      #library-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        list-style: none;
      }
      .library-item {
        display: grid;
        grid-template-columns: 56px 1fr auto;
        gap: 10px;
        align-items: center;
        border: 1px solid #000;
        padding: 8px;
      }
      .library-item.selected {
        outline: 2px solid #0000ff;
      }
      .library-item img {
        width: 56px;
        height: 36px;
        object-fit: cover;
        background: #000;
        border: 1px solid #ccc;
      }
      .library-item .thumb-fallback {
        width: 56px;
        height: 36px;
        background: #000;
      }
      .library-meta {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .library-meta .name {
        font-weight: bold;
        font-size: 0.9rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .library-meta .sub {
        font-size: 0.75rem;
        color: #666;
      }
      .library-actions {
        display: flex;
        gap: 6px;
      }
      .library-actions button,
      .library-actions a {
        padding: 6px 8px;
        font-size: 0.75rem;
        text-decoration: none;
        display: inline-block;
        border: 1px solid #000;
      }
      .library-actions a.export {
        background: #fff;
        color: #000;
      }
      .library-actions a.export:hover {
        background: #000;
        color: #fff;
      }
      .library-actions button.delete {
        background: #fff;
        color: #cc0000;
      }
      .library-actions button.delete:hover {
        background: #cc0000;
        color: #fff;
      }
      #library-empty {
        font-size: 0.85rem;
        color: #666;
      }
      @media (max-width: 640px) {
        .button-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <a class="back" href="/">&#8592; Home</a>
    <h1>Player Dashboard</h1>

    <section class="panel">
      <div class="status-row">
        <strong>Status</strong>
        <span id="status-pill" class="status-pill state-stopped">stopped</span>
      </div>
      <div class="status-row">
        <span>Target FPS</span>
        <strong id="fps-value">30</strong>
      </div>
      <div class="status-row">
        <span>PID</span>
        <strong id="pid-value">-</strong>
      </div>

      <div class="status-row">
        <label for="brightness">Brightness (1&ndash;31)</label>
        <div class="brightness-row">
          <input
            type="range"
            name="brightness"
            id="brightness"
            min="1"
            max="31"
            value="1"
            step="1"
          />
          <span id="brightness-val">1</span>
        </div>
      </div>
      <div id="brightness-warning" class="warning">
        &#9888; Brightness &gt; 1 &mdash; set to 1 for hardware testing
      </div>

      <div class="button-row">
        <button id="start-btn" type="button">Start</button>
        <button id="stop-btn" type="button">Stop</button>
        <button id="pause-btn" type="button">Pause</button>
        <button id="resume-btn" type="button">Resume</button>
        <button id="fade-btn" type="button">Fade test</button>
      </div>

      <p id="message"></p>
    </section>

    <section class="panel">
      <div class="library-head">
        <strong>Render Library</strong>
        <label class="import-label">
          Import .zip
          <input type="file" id="import-input" accept=".zip,application/zip" />
        </label>
      </div>
      <p id="library-empty" style="display: none">
        No renders yet — render a video on the
        <a href="/upload">Upload</a> page, or import a .zip.
      </p>
      <ul id="library-list"></ul>
    </section>

    <script src="dashboard.js"></script>
  </body>
</html>
