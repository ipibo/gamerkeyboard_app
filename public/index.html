<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RGB Keyboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      font-family: franklin-gothic-urw, "Franklin Gothic Medium", Arial, sans-serif;
    }
    .nav {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    a {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 60px;
      color: #000;
      text-decoration: underline;
      font-size: 1.2rem;
      transition: color 0.2s;
    }
    a:hover { color: #0000ff; }
    ::selection { color: #fff; background: #000; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/setup">Keyboard Setup</a>
    <a href="/upload">Upload Video</a>
  </nav>
</body>
</html>
